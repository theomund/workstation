---
name: linux
run-name: Linux Build
"on": [push]
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Disable AppArmor Restriction
        run: sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
      - name: Setup Native Overlay Driver
        run: |
          sudo tee /etc/containers/storage.conf >/dev/null <<'EOF'
          [storage]
          driver = "overlay"
          graphroot = "/var/lib/containers/storage"
          runroot = "/run/containers/storage"
          transient_store = true

          [storage.options.overlay]
          mountopt = "nodev,redirect_dir=off,metacopy=off"
          EOF
      - name: Setup Development Container
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/theomund/workstation/devcontainer
          cacheFrom: ghcr.io/theomund/workstation/devcontainer
          push: always
          runCmd: task ci
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: isos
          path: target/iso/
