---
name: linux
"on":
  push: {branches: [main]}
  pull_request: {branches: [main]}
permissions: {contents: read, packages: write}
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Login to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Host System
        run: |
          sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          printf 'N' | sudo tee /sys/module/overlay/parameters/redirect_dir
      - name: Run Development Container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca  # v0.3.1900000450
        with:
          env: |
            REGISTRY_USER=${{ github.actor }}
            REGISTRY_PASSWORD=${{ secrets.GITHUB_TOKEN }}
          imageName: ghcr.io/theomund/workstation/devcontainer
          runCmd: task ci
      - name: Upload ISO
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with: {archive: false, path: target/iso/*.iso}
