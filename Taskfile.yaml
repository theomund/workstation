---
version: "3"

run: when_changed

vars:
  G_BASE: >-
    quay.io/almalinuxorg/almalinux-bootc@sha256:2fc27d12a9f62fcf11d0ec034fc40d5df6602d383d035c57206220eda95db6b2
  G_NAME: workstation
  G_REGISTRY: ghcr.io/theomund/{{.G_NAME}}
  G_VERSION: 0.4.1
  G_PAYLOAD: "{{.G_REGISTRY}}/payload:{{.G_VERSION}}"

tasks:
  ci:
    desc: Run CI/CD pipeline.
    deps: [lint, iso]

  clean:
    desc: Clean the project.
    cmd: git clean -fdx

  container:*:
    desc: Build a container.
    vars:
      COMPONENT: "{{index .MATCH 0}}"
      SOURCE: src/{{.COMPONENT}}
      TARGET: target/{{.COMPONENT}}
      TAG: "{{.G_REGISTRY}}/{{.COMPONENT}}:{{.G_VERSION}}"
      CONTAINER: "{{.TARGET}}/iid.txt"
      OCI: "{{.TARGET}}/oci"
    sources: ["{{.SOURCE}}/**/*", Taskfile.yaml]
    generates: ["{{.CONTAINER}}"]
    deps: [pull]
    cmds:
      - mkdir -p "{{.TARGET}}"
      - podman-remote build
        {{if eq .COMPONENT "installer"}}
        --build-arg TAG={{.G_PAYLOAD}}
        {{end}}
        {{if eq .COMPONENT "payload"}}
        --build-arg CHUNKAH_CHOWN="$(id -u):$(id -g)"
        --build-arg CHUNKAH_CONFIG_STR="$(podman-remote inspect {{.G_BASE}})"
        --build-arg CHUNKAH_OUTPUT="$WORKSPACE_PATH/{{.OCI}}"
        --security-opt label=disable
        --skip-unused-stages=false
        -v "$WORKSPACE_PATH/{{.TARGET}}:/run/src"
        {{end}}
        --build-arg BASE={{.G_BASE}}
        --iidfile "{{.CONTAINER}}"
        -t {{.TAG}}
        "{{.SOURCE}}"

  default:
    desc: Print project tasks.
    silent: true
    cmd: task -l

  iso:
    desc: Build the ISO image.
    vars: {ISO: "target/iso/{{.G_NAME}}-{{.G_VERSION}}.iso"}
    sources:
      - target/installer/iid.txt
      - target/payload/iid.txt
    generates: ["{{.ISO}}"]
    deps: [container:installer, container:payload]
    cmds:
      - mkdir -p "{{dir .ISO}}"
      - podman-remote run
        --privileged
        --rm
        -v /var/lib/containers/storage:/var/lib/containers/storage
        -v "$WORKSPACE_PATH/{{dir .ISO}}:/output"
        ghcr.io/osbuild/image-builder@sha256:df3f4e525945c868d8014b859cd4f1d2efd8d749e40d8e3b9b9e6a05ca3b95b0
        build
        --bootc-installer-payload-ref {{.G_PAYLOAD}}
        --bootc-ref {{.G_REGISTRY}}/installer:{{.G_VERSION}}
        --output-dir "/output"
        --output-name {{base .ISO}}
        bootc-generic-iso

  lint:
    desc: Lint the source code.
    cmd: yamllint "."

  pull:
    desc: Pull the base image.
    status: ["podman-remote image exists {{.G_BASE}}"]
    cmd: podman-remote pull {{.G_BASE}}
