---
version: "3"

dotenv: [".env"]

run: when_changed

vars:
  G_BASE: >-
    quay.io/almalinuxorg/almalinux-bootc:10@sha256:845ed9da37bd39776fd8be377b23046d614160a81c8a577255d07a983f73068e
  G_NAME: workstation
  G_REGISTRY: ghcr.io
  G_NAMESPACE: "{{.G_REGISTRY}}/theomund/{{.G_NAME}}"
  G_VERSION: 0.8.0
  G_PAYLOAD: "{{.G_NAMESPACE}}/payload:{{.G_VERSION}}"

tasks:
  ci:
    desc: Run CI/CD pipeline.
    deps: [iso, push]

  clean:
    desc: Clean the project.
    cmd: git clean -fdxe ".env"

  container:*:
    desc: Build a container.
    vars:
      COMPONENT: "{{index .MATCH 0}}"
      IID: "target/{{.COMPONENT}}/iid.txt"
      SOURCE: src/{{.COMPONENT}}
      TAG: "{{.G_NAMESPACE}}/{{.COMPONENT}}:{{.G_VERSION}}"
    sources: ["{{.SOURCE}}/**/*", Taskfile.yaml]
    generates: ["{{.IID}}"]
    deps: [lint, pull]
    cmds:
      - mkdir -p "{{dir .IID}}"
      - sudo podman build
        {{if eq .COMPONENT "installer"}}
        --build-arg TAG={{.G_PAYLOAD}}
        {{end}}
        {{if eq .COMPONENT "payload"}}
        --build-arg CHUNKAH_CONFIG_STR="$(sudo podman inspect {{.G_BASE}})"
        --skip-unused-stages=false
        {{end}}
        --build-arg BASE={{.G_BASE}}
        --iidfile "{{.IID}}"
        -t {{.TAG}}
        "{{.SOURCE}}"

  default:
    desc: Print project tasks.
    silent: true
    cmd: task -l

  iso:
    desc: Build the ISO image.
    vars:
      ISO: target/iso/{{.G_NAME}}-v{{.G_VERSION}}.iso
    sources: [target/installer/iid.txt, target/payload/iid.txt]
    generates: ["{{.ISO}}"]
    deps: [container:installer, container:payload]
    cmds:
      - mkdir -p "{{dir .ISO}}"
      - sudo unshare
        --mount
        --propagation private
        image-builder build
        --bootc-installer-payload-ref {{.G_PAYLOAD}}
        --bootc-ref {{.G_NAMESPACE}}/installer:{{.G_VERSION}}
        --output-dir {{dir .ISO}}
        --output-name {{base .ISO}}
        bootc-generic-iso

  lint:
    desc: Lint the source code.
    cmd: yamllint "."

  login:
    desc: Login to the container registry.
    status: ["sudo podman login --get-login {{.G_REGISTRY}}"]
    cmd: sudo podman login
         -u $REGISTRY_USER
         -p $REGISTRY_PASSWORD
         {{.G_REGISTRY}}

  push:
    desc: Push the payload image.
    deps: [container:payload, login]
    cmd: sudo podman push {{.G_PAYLOAD}}

  pull:
    desc: Pull the base image.
    status: ["sudo podman image exists {{.G_BASE}}"]
    cmd: sudo podman pull {{.G_BASE}}

  update:
    desc: Update the project dependencies.
    env:
      LOG_LEVEL: debug
    cmd: renovate --platform=local
