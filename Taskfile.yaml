---
version: "3"

includes:
  common:
    taskfile: src/helper/Taskfile.yaml
    vars:
      G_COMPONENT: common
  installer:
    taskfile: src/helper/Taskfile.yaml
    vars:
      G_COMPONENT: installer
  iso:
    taskfile: src/iso/Taskfile.yaml
  payload:
    taskfile: src/helper/Taskfile.yaml
    vars:
      G_COMPONENT: payload

dotenv: [".env"]

run: when_changed

env:
  RELEASE: 1
  VERSION: 0.3.0

vars:
  G_COMPONENTS: [common, installer, payload]
  G_NAME: workstation
  G_REGISTRY: ghcr.io/theomund/{{.G_NAME}}
  G_SUFFIX: "{{.VERSION}}-{{.RELEASE}}"

  G_CONTAINER_FORMAT: >-
    target/%[1]s/container/{{.G_NAME}}-%[1]s-{{.G_SUFFIX}}-iid.txt
  G_ISO_FORMAT: target/iso/%[1]s/{{.G_NAME}}-{{.G_SUFFIX}}-%[1]s.iso
  G_OCI_FORMAT: target/%[1]s/oci/{{.G_NAME}}-%[1]s-{{.G_SUFFIX}}-oci.tar
  G_TAG_FORMAT: "{{.G_REGISTRY}}/%s:{{.G_SUFFIX}}"

tasks:
  ci:
    desc: Run CI/CD pipeline.
    cmds:
      - task: lint
      - task: iso

  clean:
    desc: Clean the project.
    cmds:
      - git clean -fdxe '.env'

  container:
    desc: Build all container images.
    deps:
      - for: {var: G_COMPONENTS}
        task: "{{.ITEM}}:container"

  cve:
    desc: Build all CVE tables.
    deps:
      - for: {var: G_COMPONENTS}
        task: "{{.ITEM}}:cve"

  db:
    desc: Update CVE database.
    cmds:
      - grype db update

  default:
    desc: Print project tasks.
    silent: true
    cmds:
      - task -l

  iso:
    desc: Build all ISO images.
    deps:
      - iso:install
      - iso:upgrade

  lint:
    desc: Lint the source code.
    deps:
      - lint:rpmlint
      - lint:shellcheck
      - lint:yamllint

  lint:rpmlint:
    desc: Lint the RPM packages.
    deps:
      - rpm
    cmds:
      - rpmlint "target/"*"/rpm/"*".src.rpm"

  lint:shellcheck:
    desc: Lint the shell scripts.
    cmds:
      - shellcheck
        "src/iso/upgrade/upgrade.sh"
        "src/payload/rootfs/usr/libexec/{{.G_NAME}}-payload"

  lint:yamllint:
    desc: Lint the YAML files.
    cmds:
      - yamllint "."

  rootfs:
    desc: Build all root filesystem archives.
    deps:
      - for: {var: G_COMPONENTS}
        task: "{{.ITEM}}:rootfs"

  rpm:
    desc: Build all RPM packages.
    deps:
      - for: {var: G_COMPONENTS}
        task: "{{.ITEM}}:rpm"

  sbom:
    desc: Build all SBOM files.
    deps:
      - for: {var: G_COMPONENTS}
        task: "{{.ITEM}}:sbom"
