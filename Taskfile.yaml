---
version: "3"

includes:
  installer: &helper src/helper
  payload: *helper

dotenv: [".env"]

run: when_changed

env: {RELEASE: 1, VERSION: 0.3.1}

vars:
  G_COMPONENTS: [installer, payload]
  G_NAME: workstation
  G_REGISTRY: ghcr.io/theomund/{{.G_NAME}}
  G_SUFFIX: "{{.VERSION}}-{{.RELEASE}}"

  G_PATH_FORMAT: target/%[1]s/%[2]s/{{.G_NAME}}-%[1]s-{{.G_SUFFIX}}%[3]s
  G_TAG_FORMAT: "{{.G_REGISTRY}}/%s:{{.G_SUFFIX}}"

tasks:
  build:*:
    desc: Build an artifact type for all components.
    deps:
      - for: {var: G_COMPONENTS}
        task: "{{.ITEM}}:{{index .MATCH 0}}"

  ci:
    desc: Run CI/CD pipeline.
    cmds: [{task: lint}, {task: iso}]

  clean:
    desc: Clean the project.
    cmd: git clean -fdxe '.env'

  db:
    desc: Update CVE database.
    cmd: grype db update

  default:
    desc: Print project tasks.
    silent: true
    cmd: task -l

  iso:
    desc: Build all ISO images.
    deps: [iso:install, iso:upgrade]

  iso:install:
    desc: Build installation ISO image.
    vars:
      ISO: '{{printf .G_PATH_FORMAT "iso" "install" "-install.iso"}}'
      ROOT: "{{dir .ISO}}/root"
      STORAGE: /var/lib/containers/storage
    sources:
      - '{{printf .G_PATH_FORMAT "installer" "container" "-iid.txt"}}'
      - '{{printf .G_PATH_FORMAT "payload" "container" "-iid.txt"}}'
    generates: ["{{.ISO}}"]
    deps: ["build:container"]
    cmds:
      - mkdir -p "{{.ROOT}}"
      - defer: rm -rf "{{.ROOT}}"
      - podman-remote run
        --privileged
        --rm
        -v "{{.STORAGE}}:{{.STORAGE}}"
        -v "$WORKSPACE_PATH/{{.ROOT}}:/output"
        ghcr.io/osbuild/image-builder@sha256:894c6eabff8a18d5cd20ac6da869bf013c0a11bca49087205527921ac035ed2f
        build
        --bootc-installer-payload-ref {{printf .G_TAG_FORMAT "payload"}}
        --bootc-ref {{printf .G_TAG_FORMAT "installer"}}
        --output-dir "/output"
        bootc-generic-iso
      - mv "{{.ROOT}}"/*.iso "{{.ISO}}"

  iso:upgrade:
    desc: Build upgrade ISO image.
    vars:
      ISO: '{{printf .G_PATH_FORMAT "iso" "upgrade" "-upgrade.iso"}}'
      PAYLOAD: '{{printf .G_PATH_FORMAT "payload" "oci" "-oci.tar"}}'
      SOURCE: src/iso
    sources: ["{{.PAYLOAD}}", "{{.SOURCE}}/upgrade.sh"]
    generates: ["{{.ISO}}"]
    deps: ["payload:oci"]
    cmds:
      - mkdir -p "{{dir .ISO}}"
      - mkisofs -R -J -o "{{.ISO}}" "{{.SOURCE}}" "{{.PAYLOAD}}"

  lint:
    desc: Lint the source code.
    deps: [lint:rpmlint, lint:shellcheck, lint:yamllint]

  lint:rpmlint:
    desc: Lint the RPM packages.
    deps: [build:rpm]
    cmd: rpmlint "target/"*"/rpm/"*".src.rpm"

  lint:shellcheck:
    desc: Lint the shell scripts.
    cmd: shellcheck "src/iso/upgrade.sh"

  lint:yamllint:
    desc: Lint the YAML files.
    cmd: yamllint "."
