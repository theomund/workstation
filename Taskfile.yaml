---
version: "3"

dotenv: [".env"]

run: when_changed

vars:
  G_BASE: quay.io/almalinuxorg/almalinux-bootc@sha256:c02700e75fdffaa98c6f3a9994a27effb85a041f80f5dc3ad3bb9dacfca426af
  G_NAME: workstation
  G_REGISTRY: ghcr.io
  G_NAMESPACE: "{{.G_REGISTRY}}/theomund/{{.G_NAME}}"
  G_VERSION: 0.7.0
  G_PAYLOAD: "{{.G_NAMESPACE}}/payload:{{.G_VERSION}}"

tasks:
  ci:
    desc: Run CI/CD pipeline.
    deps: [iso, push]

  clean:
    desc: Clean the project.
    cmd: git clean -fdxe ".env"

  container:*:
    desc: Build a container.
    vars:
      COMPONENT: "{{index .MATCH 0}}"
      SOURCE: src/{{.COMPONENT}}
      TAG: "{{.G_NAMESPACE}}/{{.COMPONENT}}:{{.G_VERSION}}"

      TARGET: target/{{.COMPONENT}}
      CONTAINER: "{{.TARGET}}/iid.txt"
      OCI: "{{.TARGET}}/oci"
    sources: ["{{.SOURCE}}/**/*", Taskfile.yaml]
    generates: ["{{.CONTAINER}}"]
    deps: [lint, pull]
    cmds:
      - mkdir -p "{{.TARGET}}"
      - podman-remote build
        {{if eq .COMPONENT "installer"}}
        --build-arg TAG={{.G_PAYLOAD}}
        {{end}}
        {{if eq .COMPONENT "payload"}}
        --build-arg CHUNKAH_CHOWN="$(id -u):$(id -g)"
        --build-arg CHUNKAH_CONFIG_STR="$(podman-remote inspect {{.G_BASE}})"
        --build-arg CHUNKAH_OUTPUT="$WORKSPACE_PATH/{{.OCI}}"
        --security-opt label=disable
        --skip-unused-stages=false
        -v "$WORKSPACE_PATH/{{.TARGET}}:/run/src"
        {{end}}
        --iidfile "{{.CONTAINER}}"
        -t {{.TAG}}
        "{{.SOURCE}}"

  default:
    desc: Print project tasks.
    silent: true
    cmd: task -l

  iso:
    desc: Build the ISO image.
    vars:
      ISO: target/iso/{{.G_NAME}}-{{.G_VERSION}}.iso
    sources: [target/installer/iid.txt, target/payload/iid.txt]
    generates: ["{{.ISO}}"]
    deps: [container:installer, container:payload]
    cmds:
      - mkdir -p "{{dir .ISO}}"
      - podman-remote run
        --privileged
        --rm
        -v /var/lib/containers/storage:/var/lib/containers/storage
        -v "$WORKSPACE_PATH/{{dir .ISO}}:/output"
        ghcr.io/osbuild/image-builder@sha256:f33fa06204ab382eed24979bc99e880b221fbded5a369a0f40ded881d649d392
        build
        --bootc-installer-payload-ref {{.G_PAYLOAD}}
        --bootc-ref {{.G_NAMESPACE}}/installer:{{.G_VERSION}}
        --output-dir "/output"
        --output-name {{base .ISO}}
        bootc-generic-iso

  lint:
    desc: Lint the source code.
    cmd: yamllint "."

  login:
    desc: Login to the container registry.
    status: ["podman-remote login --get-login {{.G_REGISTRY}}"]
    cmd: podman-remote login
         -u $REGISTRY_USER
         -p $REGISTRY_PASSWORD
         {{.G_REGISTRY}}

  push:
    desc: Push the payload image.
    deps: [container:payload, login]
    cmd: podman-remote push {{.G_PAYLOAD}}

  pull:
    desc: Pull the base image.
    status: ["podman-remote image exists {{.G_BASE}}"]
    cmd: podman-remote pull {{.G_BASE}}

  update:
    desc: Update the project dependencies.
    cmd: renovate --platform=local --dry-run=extract
