---
version: "3"

tasks:
  install:
    desc: Build installation ISO image.
    vars:
      CONFIG: src/iso/install/config.toml
      ISO: target/iso/install/workstation-{{.VERSION}}-{{.RELEASE}}-install.iso
      ROOT: target/iso/install/root
    sources:
      - "{{.CONFIG}}"
    generates:
      - "{{.ISO}}"
    deps:
      - :container
    cmds:
      - mkdir -p {{.ROOT}}
      - podman-remote run
        --privileged
        --rm
        -v /var/lib/containers/storage:/var/lib/containers/storage
        -v $WORKSPACE_PATH/{{.CONFIG}}:/config.toml
        -v $WORKSPACE_PATH/{{.ROOT}}:/output
        ghcr.io/osbuild/image-builder:v84.0.0
        build
        --blueprint /config.toml
        --bootc-installer-payload-ref {{.REGISTRY}}/payload:latest
        --bootc-ref {{.REGISTRY}}/installer:latest
        --output-dir /output
        bootc-installer
      - cp {{.ROOT}}/bootc-almalinux-*-bootc-installer-x86_64.iso {{.ISO}}

  upgrade:
    desc: Build upgrade ISO image.
    vars:
      ISO: target/iso/upgrade/workstation-{{.VERSION}}-{{.RELEASE}}-upgrade.iso
      ROOT: target/iso/upgrade/root
      SOURCE: src/iso/upgrade/*
    sources:
      - "{{.SOURCE}}"
    generates:
      - "{{.ISO}}"
    deps:
      - :payload:container
    cmds:
      - mkdir -p {{.TARGET}}
      - cp -r {{.SOURCE}} target/payload/container {{.ROOT}}
      - mkisofs -R -J -o {{.ISO}} {{.ROOT}}
