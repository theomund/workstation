---
version: "3"

tasks:
  install:
    desc: Build installation ISO image.
    vars:
      CONFIG: src/iso/install/config.toml
      ISO: '{{printf .G_ISO_FORMAT "install"}}'
      ROOT: target/iso/install/root
      STORAGE: /var/lib/containers/storage
    sources:
      - "{{.CONFIG}}"
      - '{{printf .G_CONTAINER_FORMAT "installer"}}'
      - '{{printf .G_CONTAINER_FORMAT "payload"}}'
    generates: ["{{.ISO}}"]
    deps: [":container"]
    cmds:
      - mkdir -p "{{.ROOT}}"
      - defer: rm -rf "{{.ROOT}}"
      - podman-remote run
        --privileged
        --rm
        -v "{{.STORAGE}}:{{.STORAGE}}"
        -v "$WORKSPACE_PATH/{{.CONFIG}}:/config.toml"
        -v "$WORKSPACE_PATH/{{.ROOT}}:/output"
        ghcr.io/osbuild/image-builder:v86.0.0
        build
        --blueprint "/config.toml"
        --bootc-installer-payload-ref {{printf .G_TAG_FORMAT "payload"}}
        --bootc-ref {{printf .G_TAG_FORMAT "installer"}}
        --output-dir "/output"
        bootc-installer
      - mv "{{.ROOT}}"/*.iso "{{.ISO}}"

  upgrade:
    desc: Build upgrade ISO image.
    vars:
      ISO: '{{printf .G_ISO_FORMAT "upgrade"}}'
      PAYLOAD: '{{printf .G_OCI_FORMAT "payload"}}'
      SOURCE: src/iso/upgrade
    sources: ["{{.PAYLOAD}}", "{{.SOURCE}}/upgrade.sh"]
    generates: ["{{.ISO}}"]
    deps: [":payload:oci"]
    cmds:
      - mkdir -p "{{dir .ISO}}"
      - mkisofs -R -J -o "{{.ISO}}" "{{.SOURCE}}" "{{.PAYLOAD}}"
