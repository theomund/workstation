---
version: "3"

vars:
  INSTALLER: target/installer/container/index.json
  PAYLOAD: target/payload/container/index.json

tasks:
  install:
    desc: Build installation ISO image.
    vars:
      SOURCE: src/iso/install
      CONFIG: "{{.SOURCE}}/config.toml"
      TARGET: target/iso/install
      ISO: "{{.TARGET}}/workstation-{{.VERSION}}-{{.RELEASE}}-install.iso"
      ROOT: "{{.TARGET}}/root"
    sources:
      - "{{.CONFIG}}"
      - "{{.INSTALLER}}"
      - "{{.PAYLOAD}}"
    generates:
      - "{{.ISO}}"
    deps:
      - :container
    cmds:
      - mkdir -p {{.ROOT}}
      - defer: rm -rf {{.ROOT}}
      - sudo image-builder build
        --blueprint {{.CONFIG}}
        --bootc-installer-payload-ref
        {{.REGISTRY}}/payload:{{.VERSION}}-{{.RELEASE}}
        --bootc-ref
        {{.REGISTRY}}/installer:{{.VERSION}}-{{.RELEASE}}
        --output-dir {{.ROOT}}
        bootc-installer
      - cp {{.ROOT}}/*.iso {{.ISO}}

  upgrade:
    desc: Build upgrade ISO image.
    vars:
      SOURCE: src/iso/upgrade
      TARGET: target/iso/upgrade
      ISO: "{{.TARGET}}/workstation-{{.VERSION}}-{{.RELEASE}}-upgrade.iso"
      ROOT: "{{.TARGET}}/root"
    sources:
      - "{{.PAYLOAD}}"
      - "{{.SOURCE}}/upgrade.sh"
    generates:
      - "{{.ISO}}"
    deps:
      - :payload:container
    cmds:
      - mkdir -p {{.ROOT}}
      - defer: rm -rf {{.ROOT}}
      - cp -r {{.SOURCE}} target/payload/container {{.ROOT}}
      - mkisofs -R -J -o {{.ISO}} {{.ROOT}}
