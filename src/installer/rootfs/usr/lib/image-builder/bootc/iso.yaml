---
label: Workstation-Installer
grub2:
  entries:
    - name: Install Workstation
      linux: >-
        /images/pxeboot/vmlinuz inst.stage2=hd:LABEL=Workstation-Installer
        inst.text console=tty0 selinux=0
      initrd: /images/pxeboot/initrd.img
