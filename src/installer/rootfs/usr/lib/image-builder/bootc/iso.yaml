---
label: Workstation-Installer
grub2:
  entries:
    - name: Install Workstation
      linux: >-
        /images/pxeboot/vmlinuz
        console=tty0
        inst.ks=file:/usr/share/anaconda/workstation-installer.ks
        inst.selinux=0
        inst.stage2=hd:LABEL=Workstation-Installer
        inst.text
      initrd: /images/pxeboot/initrd.img
