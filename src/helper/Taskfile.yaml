---
version: "3"

vars:
  PREFIX: workstation-{{.COMPONENT}}-{{.VERSION}}-{{.RELEASE}}
  SOURCE: src/{{.COMPONENT}}
  TARGET: target/{{.COMPONENT}}
  CONTAINER: "{{.TARGET}}/container"
  CVE: "{{.TARGET}}/cve/{{.PREFIX}}-cve.txt"
  ROOTFS: "{{.TARGET}}/rootfs/{{.PREFIX}}-rootfs.tar.gz"
  RPM: "{{.TARGET}}/rpm/{{.PREFIX}}.el10.x86_64.rpm"
  SBOM: "{{.TARGET}}/sbom/{{.PREFIX}}-sbom.json"
  SRPM: "{{.TARGET}}/srpm/{{.PREFIX}}.el10.src.rpm"

tasks:
  container:
    desc: Build {{.COMPONENT}} container.
    vars:
      BASE: "{{.REGISTRY}}/common:{{.VERSION}}-{{.RELEASE}}"
      CONTAINERFILE: "{{.SOURCE}}/container/Containerfile"
      STORAGE: /var/lib/containers
      TAG: "{{.REGISTRY}}/{{.COMPONENT}}:{{.VERSION}}-{{.RELEASE}}"
    sources:
      - "{{.CONTAINERFILE}}"
      - "{{.RPM}}"
    generates:
      - "{{.CONTAINER}}/index.json"
    deps:
      - rpm
    cmds:
      - task: :common:container
        if: '{{ne .COMPONENT "common"}}'
      - sudo podman build
        {{if ne .COMPONENT "common"}}--build-arg BASE={{.BASE}}{{end}}
        -f {{.CONTAINERFILE}}
        -t {{.TAG}}
        .
      - cmd: sudo podman run
             --privileged
             --cgroups=disabled
             --rm
             -v {{.STORAGE}}:{{.STORAGE}}
             {{.TAG}}
             /usr/libexec/bootc-base-imagectl
             rechunk
             {{.TAG}}
             {{.TAG}}
        if: '{{eq .COMPONENT "payload"}}'
      - sudo podman save --format oci-dir -o {{.CONTAINER}} {{.TAG}}
      - sudo chown -R $(id -u):$(id -g) {{.CONTAINER}}

  cve:
    desc: Build {{.COMPONENT}} CVE table.
    env:
      NO_COLOR: "1"
    sources:
      - "{{.SBOM}}"
    generates:
      - "{{.CVE}}"
    deps:
      - :db
      - sbom
    cmds:
      - grype sbom:{{.SBOM}} -o table={{.CVE}}

  rootfs:
    desc: Build {{.COMPONENT}} root filesystem archive.
    vars:
      FILES: "{{.SOURCE}}/rootfs"
    sources:
      - "{{.FILES}}/**/*"
    generates:
      - "{{.ROOTFS}}"
    cmds:
      - mkdir -p {{.TARGET}}/rootfs
      - tar --exclude '.gitkeep' -czvf {{.ROOTFS}} -C {{.FILES}} .

  rpm:
    desc: Build {{.COMPONENT}} RPM package.
    vars:
      ROOT: "{{.TARGET}}/rpm/root"
    sources:
      - "{{.SRPM}}"
    generates:
      - "{{.RPM}}"
    deps:
      - srpm
    cmds:
      - mkdir -p {{.ROOT}}
      - defer: rm -rf {{.ROOT}}
      - rpmbuild --define "_topdir $(pwd)/{{.ROOT}}" --rebuild {{.SRPM}}
      - cp {{.ROOT}}/RPMS/x86_64/*.rpm {{.TARGET}}/rpm

  srpm:
    desc: Build {{.COMPONENT}} SRPM package.
    vars:
      ROOT: "{{.TARGET}}/srpm/root"
      SPEC: "{{.SOURCE}}/srpm/workstation-{{.COMPONENT}}.spec"
      SOURCES: "{{.ROOT}}/SOURCES"
    sources:
      - "{{.ROOTFS}}"
      - "{{.SPEC}}"
    generates:
      - "{{.SRPM}}"
    deps:
      - rootfs
    cmds:
      - mkdir -p {{.SOURCES}}
      - defer: rm -rf {{.ROOT}}
      - cp {{.ROOTFS}} {{.SOURCES}}
      - rpmbuild --define "_topdir $(pwd)/{{.ROOT}}" -bs {{.SPEC}}
      - cp {{.ROOT}}/SRPMS/*.src.rpm {{.TARGET}}/srpm

  sbom:
    desc: Build {{.COMPONENT}} SBOM file.
    env:
      SYFT_GOLANG_CAPTURE_SYMBOLS: all
    sources:
      - "{{.CONTAINER}}/index.json"
    generates:
      - "{{.SBOM}}"
    deps:
      - container
    cmds:
      - syft oci-dir:{{.CONTAINER}} -o syft-json={{.SBOM}}
