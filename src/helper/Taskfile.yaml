---
version: "3"

vars:
  G_COMPONENT: '{{splitList ":" .TASK | first}}'
  G_SOURCE: src/{{.G_COMPONENT}}
  G_TAG: "{{printf .G_TAG_FORMAT .G_COMPONENT}}"

  G_CONTAINER: '{{printf .G_PATH_FORMAT .G_COMPONENT "container" "-iid.txt"}}'
  G_OCI: '{{printf .G_PATH_FORMAT .G_COMPONENT "oci" "-oci.tar"}}'
  G_ROOTFS: '{{printf .G_PATH_FORMAT .G_COMPONENT "rootfs" "-rootfs.tar.gz"}}'
  G_RPM: '{{printf .G_PATH_FORMAT .G_COMPONENT "rpm" ".el10.x86_64.rpm"}}'
  G_SBOM: '{{printf .G_PATH_FORMAT .G_COMPONENT "sbom" "-sbom.json"}}'

tasks:
  container:
    desc: Build {{.G_COMPONENT}} container.
    vars:
      BASE: >-
        quay.io/almalinuxorg/almalinux-bootc@sha256:7a80a51c0890f5ed736a8517e13adfa7dc6d882ac9838b6d8d60cd5207fbb69f
      CONTAINERFILE: "{{.G_SOURCE}}/container/Containerfile"
      ROOT: "{{dir .G_CONTAINER}}/root"
    sources:
      - "{{.CONTAINERFILE}}"
      - "{{.G_RPM}}"
    generates: ["{{.G_CONTAINER}}"]
    deps: [rpm]
    status: ["podman-remote image exists {{.G_TAG}}"]
    cmds:
      - mkdir -p "{{.ROOT}}"
      - defer: rm -rf "{{.ROOT}}"
      - podman-remote pull "{{.BASE}}"
      - podman-remote build
        --iidfile "{{.G_CONTAINER}}"
        --build-arg BASE={{.BASE}}
        {{if eq .G_COMPONENT "payload"}}
        --build-arg CHUNKAH_CHOWN="$(id -u):$(id -g)"
        --build-arg CHUNKAH_CONFIG_STR="$(podman-remote inspect {{.BASE}})"
        --build-arg CHUNKAH_OUTPUT="$WORKSPACE_PATH/{{.ROOT}}/out"
        --security-opt label=disable
        --skip-unused-stages=false
        -v "$WORKSPACE_PATH/{{.ROOT}}:/run/src"
        {{end}}
        -f "{{.CONTAINERFILE}}"
        -t {{.G_TAG}}
        "."

  cve:
    desc: Build {{.G_COMPONENT}} CVE table.
    env: {NO_COLOR: "1"}
    vars: {CVE: '{{printf .G_PATH_FORMAT .G_COMPONENT "cve" "-cve.txt"}}'}
    sources: ["{{.G_SBOM}}"]
    generates: ["{{.CVE}}"]
    deps: [":db", sbom]
    cmd: grype sbom:"{{.G_SBOM}}" -o table="{{.CVE}}"

  oci:
    desc: Build {{.G_COMPONENT}} container archive.
    sources: ["{{.G_CONTAINER}}"]
    generates: ["{{.G_OCI}}"]
    deps: [container]
    cmds:
      - mkdir -p "{{dir .G_OCI}}"
      - podman-remote save --format oci-archive -o "{{.G_OCI}}" {{.G_TAG}}

  rootfs:
    desc: Build {{.G_COMPONENT}} root filesystem archive.
    vars: {FILES: "{{.G_SOURCE}}/rootfs"}
    sources: ["{{.FILES}}/**/*"]
    generates: ["{{.G_ROOTFS}}"]
    cmds:
      - mkdir -p "{{dir .G_ROOTFS}}"
      - tar -czvf "{{.G_ROOTFS}}" -C "{{.FILES}}" "."

  rpm:
    desc: Build {{.G_COMPONENT}} SRPM/RPM package.
    vars:
      SPEC: "{{.G_SOURCE}}/rpm/{{.G_NAME}}-{{.G_COMPONENT}}.spec"
      SRPM: '{{printf .G_PATH_FORMAT .G_COMPONENT "rpm" ".el10.src.rpm"}}'
      TOP_DIR: "{{.ROOT_DIR}}/{{dir .G_RPM}}/root"
    sources: ["{{.G_ROOTFS}}", "{{.SPEC}}"]
    generates: ["{{.G_RPM}}", "{{.SRPM}}"]
    deps: [rootfs]
    cmds:
      - defer: rm -rf "{{.TOP_DIR}}"
      - rpmbuild
        -D "_rpmdir {{.ROOT_DIR}}/{{dir .G_RPM}}"
        -D "_sourcedir {{.ROOT_DIR}}/{{dir .G_ROOTFS}}"
        -D "_topdir {{.TOP_DIR}}"
        -ba "{{.SPEC}}"

  sbom:
    desc: Build {{.G_COMPONENT}} SBOM file.
    env: {SYFT_GOLANG_CAPTURE_SYMBOLS: all}
    sources: ["{{.G_OCI}}"]
    generates: ["{{.G_SBOM}}"]
    deps: [oci]
    cmd: syft oci-archive:"{{.G_OCI}}" -o syft-json="{{.G_SBOM}}"
