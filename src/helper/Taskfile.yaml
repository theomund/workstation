---
version: "3"

vars:
  PREFIX: workstation-{{.COMPONENT}}-{{.VERSION}}-{{.RELEASE}}
  SOURCE: src/{{.COMPONENT}}
  TARGET: target/{{.COMPONENT}}
  CONTAINER: "{{.TARGET}}/container"
  CVE: "{{.TARGET}}/cve/{{.PREFIX}}-cve.txt"
  ROOTFS: "{{.TARGET}}/rootfs/{{.PREFIX}}-rootfs.tar.gz"
  RPM: "{{.TARGET}}/rpm/{{.PREFIX}}.el10.x86_64.rpm"
  SBOM: "{{.TARGET}}/sbom/{{.PREFIX}}-sbom.json"
  SRPM: "{{.TARGET}}/srpm/{{.PREFIX}}.el10.src.rpm"

tasks:
  container:
    desc: Build {{.COMPONENT}} container.
    vars:
      BASE: "{{.REGISTRY}}/common:{{.VERSION}}-{{.RELEASE}}"
      CONTAINERFILE: "{{.SOURCE}}}/container/Containerfile"
      PAYLOAD: $WORKSPACE_PATH/target/payload
      TAG: "{{.REGISTRY}}/{{.COMPONENT}}:{{.VERSION}}-{{.RELEASE}}"
    sources:
      - "{{.CONTAINERFILE}}"
      - "{{.RPM}}"
    generates:
      - "{{.CONTAINER}}/index.json"
    deps:
      - rpm
    cmds:
      - task: :common:container
        if: '{{ne .COMPONENT "common"}}'
      - podman-remote build
        {{if ne .COMPONENT "common"}}
        --build-arg BASE={{.BASE}}
        {{end}}
        {{if eq .COMPONENT "payload"}}
        --build-arg CHUNKAH_CONFIG_STR="$(podman-remote inspect {{.BASE}})"
        --build-arg CHUNKAH_OUTPUT={{.PAYLOAD}}/out
        --security-opt label=disable
        --skip-unused-stages=false
        {{end}}
        -f {{.CONTAINERFILE}}
        -t {{.TAG}}
        -v {{.PAYLOAD}}:/run/src
        .
      - podman-remote save --format oci-dir -o {{.CONTAINER}} {{.TAG}}

  cve:
    desc: Build {{.COMPONENT}} CVE table.
    env:
      NO_COLOR: "1"
    sources:
      - "{{.SBOM}}"
    generates:
      - "{{.CVE}}"
    deps:
      - :db
      - sbom
    cmds:
      - grype sbom:{{.SBOM}} -o table={{.CVE}}

  rootfs:
    desc: Build {{.COMPONENT}} root filesystem archive.
    vars:
      FILES: "{{.SOURCE}}/rootfs"
    sources:
      - "{{.FILES}}/**/*"
    generates:
      - "{{.ROOTFS}}"
    cmds:
      - mkdir -p {{.TARGET}}/rootfs
      - tar --exclude '.gitkeep' -czvf {{.ROOTFS}} -C {{.FILES}} .

  rpm:
    desc: Build {{.COMPONENT}} RPM package.
    env:
      TOP_DIR: "{{.ROOT_DIR}}/{{.TARGET}}/rpm/root"
    sources:
      - "{{.SRPM}}"
    generates:
      - "{{.RPM}}"
    deps:
      - srpm
    cmds:
      - mkdir -p $TOP_DIR
      - defer: rm -rf $TOP_DIR
      - rpmbuild --rebuild {{.SRPM}}
      - cp $TOP_DIR/RPMS/x86_64/*.rpm {{.TARGET}}/rpm

  srpm:
    desc: Build {{.COMPONENT}} SRPM package.
    env:
      TOP_DIR: "{{.ROOT_DIR}}/{{.TARGET}}/srpm/root"
    vars:
      SPEC: "{{.SOURCE}}/srpm/workstation-{{.COMPONENT}}.spec"
      SOURCES: $TOP_DIR/SOURCES
    sources:
      - "{{.ROOTFS}}"
      - "{{.SPEC}}"
    generates:
      - "{{.SRPM}}"
    deps:
      - rootfs
    cmds:
      - mkdir -p {{.SOURCES}}
      - defer: rm -rf $TOP_DIR
      - cp {{.ROOTFS}} {{.SOURCES}}
      - rpmbuild -bs {{.SPEC}}
      - cp $TOP_DIR/SRPMS/*.src.rpm {{.TARGET}}/srpm

  sbom:
    desc: Build {{.COMPONENT}} SBOM file.
    env:
      SYFT_GOLANG_CAPTURE_SYMBOLS: all
    sources:
      - "{{.CONTAINER}}/index.json"
    generates:
      - "{{.SBOM}}"
    deps:
      - container
    cmds:
      - syft oci-dir:{{.CONTAINER}} -o syft-json={{.SBOM}}
